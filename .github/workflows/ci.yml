name: CI Pipeline Spring Boot 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']

    steps:
      - name: Revisar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Build con Maven
        run: cd backend && mvn -B clean verify

      - name: Ejecutar pruebas unitarias
        run: cd backend && mvn test

      - name: Reporte de cobertura JaCoCo
        run: cd backend && mvn jacoco:report

      - name: Publicar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: backend/target/site/jacoco

      - name: Verificar variable de entorno
        env:
          APP_ENV: ${{ secrets.APP_ENV_DEMO }}
        run: echo "Ejecutando en el ambiente configurado"
